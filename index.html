<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BaonUp · Mabuhay!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/landing.css">
</head>
<body class="landing">

  <main class="welcome">

    <!-- Mascot holding the flag -->
    <span class="mascot" data-src="assets/images/landing-mascot.jpg" data-fallback="Mascot"></span>

    <section class="welcome-card">
      <h1>Mabuhay!</h1>
      <p class="sub">Maligayang pagdating sa <strong>BaonUp</strong>!</p>

      <label class="field-label" for="nickname">Nickname:</label>
      <input id="nickname" class="nickname-input" type="text" maxlength="12"
             autocomplete="off" placeholder="Ano ang pangalan mo?">

      <p class="field-label">Grade</p>
      <div class="grade-row" role="group" aria-label="Piliin ang grade">
        <button class="grade-pill" type="button" data-grade="1">Grade 1</button>
        <button class="grade-pill" type="button" data-grade="2">Grade 2</button>
        <button class="grade-pill" type="button" data-grade="3">Grade 3</button>
      </div>

      <p class="hint" id="hint" aria-live="polite"></p>
      <button class="btn btn-green start" id="start" type="button" disabled>Simulan!</button>
    </section>
  </main>

  <script src="js/data/items.js"></script>
  <script src="js/state.js"></script>
  <script src="js/festival.js"></script>
  <script src="js/rewards.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/landing.js"></script>
</body>
</html>
