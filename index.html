<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BaonUp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@600;800&display=swap"  rel="stylesheet">
    <link rel="stylesheet" href="css/homepage.css">
</head>
<body>

    <div class="container">

        <div class="header">

            <!-- BaonUp, Barya, Grade lvl-->

            <div class="webname">

                <h1>BaonUp</h1>
                
            </div>

            <div class="header-right">
                
                <div class="currency">
                    <h3>Barya</h3>
                </div>

                <div class="level">
                    <h3>Grade 1</h3>
                </div>

            </div>
            
            

        </div>

        <div class="main">
            <div class="card-container">

                <a class="card card-reading" id="reading" style="grid-area: box-1"> 
                    <div>

                        <h1>Reading</h1>
                        <h2> Description </h2>
                        <div class="sub-card" id="sub-card1">
                            
                        </div>
                    
                    </div>
                </a>

                <a class="card card-math" id="math" style="grid-area: box-2"> 
                    <div>
                    
                        <h1>Math</h1>
                        <h2> Description </h2>
                        <div class="sub-card" id="sub-card2">
                        
                        </div>

                    </div>
                </a>

                <a class="card card-profile" id="profile" style="grid-area: box-3"> 
                    
                        <div class="profile-info">
                            <h1> My Profile </h1>
                            <h2> Kobie </h2>
                        </div>
                        
                        
                        <div class="pf-circle" id="sub-card3">
                            <img src="assets/images/profilepic.jpg">
                        </div>

                    
                </a>

                <a class="card card-store" id="store" style="grid-area: box-4"> 
                    <div>
                        <div class="card-description">
                            <h1>Sari-Sari Store</h1>
                            <h2> Description </h2>
                        </div>
                        
                        <div class="sub-card" id="sub-card4">
                            
                        </div>

                    </div>
                </a>

                <a class="card card-event" id="event" style="grid-area: box-5"> 
                    <div>
                        <div class="card-description">
                            <h1>Parol Festival</h1>
                            <h2> Description </h2>
                        </div>
                        
                        <div class="sub-card" id="sub-card5">
                            
                        </div>
                        
                    </div>
                </a>
            </div>
            
        </div>

        <div class="footer">
            <h3>
                "Ang hindi marunong magmahal sa sariling wika ay higit pa sa hayop at malansang isda" - Dr. Jose Rizal
            </h3>
        </div>
    </div>


    

</body>
</html>
