<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BaonUp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sniglet:wght@400;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/homepage.css">
</head>
<body>

    <div class="container">

        <div class="header">

            <!-- BaonUp, Barya, Grade lvl-->

            <div class="webname">

                <h1>BaonUp</h1>
                
            </div>

            <div class="currency">

                 <h3>Barya</h3>
                 

            </div>

            <div class="level">

                <h3>Grade 1</h3>
                
            </div>
            

        </div>

        <div class="main">
            <div class="card" id="reading" style="grid-area: box-1">

                <h1>Reading</h1>
                <h2> Description </h2>
                <div class="sub-card">

                </div>
                
            </div>
            <div class="card" id="math" style="grid-area: box-2">
                
                <h1>Math</h1>
                <h2> Description </h2>

            </div>
            <div class="card" id="profile" style="grid-area: box-3">

                <h1> My Profile </h1>
                <h2> Description </h2>

            </div>
            <div class="card" id="store" style="grid-area: box-4">

                <h1>Sari-Sari Store</h1>
                <h2> Description </h2>
                
            </div>
            <div class="card" id="event" style="grid-area: box-5">

                <h1>Parol Festival</h1>
                <h2> Description </h2>
                
            </div>
        </div>

        <div class="footer">
            <h3>
                "Ang hindi marunong magmahal sa sariling wika ay higit pa sa hayop at malansang isda" - Dr. Jose Rizal
            </h3>
        </div>
    </div>


    

</body>
</html>
